<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>احتفال بالطلاب المتميزين — حفظ تلقائي</title>
    <style>
        :root {
            --bg: #071025;
            --card: #0b1220;
            --accent: #ffcc00;
            --muted: #9aa7b2;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #071025 0%, #0b1630 60%);
            color: #e6eef6;
            direction: rtl;
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 24px auto;
            padding: 18px;
            position: relative;
            z-index: 5;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 0.6px;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls label, .controls button {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.9rem;
        }

        input[type="file"] {
            display: none;
        }

        .uploader {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        form.add-student {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            color: inherit;
            min-width: 150px;
        }

        button.primary {
            background: linear-gradient(90deg, #2b6df6, #5ad0ff);
            color: #02203a;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 6px 18px rgba(2, 6, 23, 0.6);
            transition: transform 0.18s, box-shadow 0.18s;
            cursor: default;
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card .name {
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        .card .sub {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .celebrate-btn {
            background: linear-gradient(90deg, #ff6b6b, #ffcc00);
            padding: 6px 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            color: #032028;
            font-weight: 700;
        }

        footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
        }

        /* Modal (overlay) */
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background: rgba(1, 6, 12, 0.45);
        }

        .overlay.show {
            display: flex;
        }

        .modal {
            width: min(1000px, 96%);
            max-height: 92vh;
            background: linear-gradient(180deg, #072033, #061426);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 30px 60px rgba(2, 6, 23, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .modal .photo {
            flex: 0 0 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .modal .photo img {
            width: 400px;
            height: 400px;
            object-fit: cover;
            border-radius: 18px;
            border: 6px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .modal .info {
            flex: 1;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            padding-right: 10px;
        }

        .modal h2 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
        }

        .modal .big-name {
            font-size: 4.2rem;
            line-height: 1;
            color: var(--accent);
            font-weight: 900;
            text-shadow: 0 10px 30px rgba(255, 204, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px;
            border-radius: 10px;
            color: var(--muted);
            cursor: pointer;
            z-index: 1100;
        }

        .controls-mini {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .small {
            font-size: 0.95rem;
            color: var(--muted);
        }

        /* canvas for fireworks & confetti full screen */
        canvas#fx {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 900;
            pointer-events: none;
        }

        /* petals */
        .petal {
            position: fixed;
            width: 18px;
            height: 18px;
            background: radial-gradient(circle at 60% 30%, rgba(255, 150, 180, 0.95), rgba(255, 90, 120, 0.9));
            border-radius: 50%;
            z-index: 920;
            pointer-events: none;
            opacity: 0.95;
            transform: rotate(0deg);
        }

        /* شخصيات كرتونية تدور حول الطالب الفائز */
        .floating-cartoon {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 1001;
            pointer-events: none;
            user-select: none;
            animation: orbit 8s linear infinite;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .floating-cartoon:nth-child(1) { animation-delay: 0s; }
        .floating-cartoon:nth-child(2) { animation-delay: -2s; }
        .floating-cartoon:nth-child(3) { animation-delay: -4s; }
        .floating-cartoon:nth-child(4) { animation-delay: -6s; }

        @keyframes orbit {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(120px, -120px) rotate(90deg); }
            50% { transform: translate(0, -240px) rotate(180deg); }
            75% { transform: translate(-120px, -120px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* صور كرتونية في أسفل الشاشة */
        .bottom-cartoons {
            position: fixed;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 800;
            pointer-events: none;
        }

        .bottom-cartoon {
            width: 120px;
            height: 120px;
            animation: bounce 3s ease-in-out infinite;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .bottom-cartoon.left {
            margin-left: 20px;
            animation-delay: 0.5s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23FF6B6B"/><circle cx="35" cy="40" r="8" fill="white"/><circle cx="65" cy="40" r="8" fill="white"/><circle cx="35" cy="40" r="4" fill="black"/><circle cx="65" cy="40" r="4" fill="black"/><path d="M 30 65 Q 50 80 70 65" stroke="white" stroke-width="3" fill="none"/></svg>');
        }

        .bottom-cartoon.right {
            margin-right: 20px;
            animation-delay: 1s;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%235ad0ff"/><circle cx="35" cy="40" r="8" fill="white"/><circle cx="65" cy="40" r="8" fill="white"/><circle cx="35" cy="40" r="4" fill="black"/><circle cx="65" cy="40" r="4" fill="black"/><path d="M 30 65 Q 50 80 70 65" stroke="white" stroke-width="3" fill="none"/></svg>');
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 900px) {
            .modal { flex-direction: column; padding: 14px; }
            .modal .photo img { width: 260px; height: 260px; }
            .modal .big-name { font-size: 2.2rem; }
            .floating-cartoon { width: 40px; height: 40px; font-size: 18px; }
            .bottom-cartoon { width: 80px; height: 80px; }
            @keyframes orbit {
                0% { transform: translate(0, 0); }
                25% { transform: translate(80px, -80px); }
                50% { transform: translate(0, -160px); }
                75% { transform: translate(-80px, -80px); }
                100% { transform: translate(0, 0); }
            }
        }

        @media (max-width: 600px) {
            header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; justify-content: center; }
            form.add-student { width: 100%; justify-content: center; }
            .bottom-cartoon { width: 60px; height: 60px; }
            .bottom-cartoon.left { margin-left: 10px; }
            .bottom-cartoon.right { margin-right: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🏆 لوحة الشرف — الطالب المثالي</h1>
            <div class="small">البيانات محفوظة تلقائياً 🔒</div>
        </div>

        <div class="controls">
            <form id="addForm" class="add-student" onsubmit="return false">
                <input id="studentName" type="text" placeholder="اسم الطالب" required />
                <label class="uploader" style="background: var(--glass); padding: 8px 12px; border-radius: 10px; cursor: pointer;">
                    📷 اختر صورة
                    <input id="studentImage" type="file" accept="image/*" style="display: none;" />
                </label>
                <button id="addBtn" class="primary">➕ أضف الطالب</button>
            </form>

            <label title="رفع موسيقى احتفالية" style="background: var(--glass); padding: 8px 12px; border-radius: 10px; cursor: pointer;">
                🎵 رفع موسيقى
                <input type="file" id="musicFile" accept="audio/*" style="display: none;" />
            </label>

            <button id="musicToggle">🔊 تشغيل/إيقاف الموسيقى</button>
            <button id="clearAll" style="background: rgba(255,80,80,0.2); border-color: #ff6666;">🗑️ مسح الكل (نهائياً)</button>
        </div>
    </header>

    <section>
        <div id="grid" class="grid" aria-live="polite"></div>
    </section>

    <footer>
        ✨ اضغط على أي بطاقة أو زر احتفال — البيانات تبقى بعد إغلاق المتصفح ✨
    </footer>
</div>

<canvas id="fx"></canvas>

<div class="bottom-cartoons">
    <div class="bottom-cartoon left"></div>
    <div class="bottom-cartoon right"></div>
</div>

<div id="overlay" class="overlay" role="dialog" aria-hidden="true">
    <div class="modal" role="document" id="modal">
        <button class="close-btn" id="closeModal">✖</button>
        <div class="photo">
            <img id="modalPhoto" alt="student photo" src="">
            <div class="floating-cartoon">🎉</div>
            <div class="floating-cartoon">🎊</div>
            <div class="floating-cartoon">⭐</div>
            <div class="floating-cartoon">🏆</div>
        </div>
        <div class="info">
            <h2>مبروك!</h2>
            <div class="big-name" id="modalName">اسم الطالب</div>
            <div class="small">نحتفل بهذا الطالب المتميز. بارك الله فيه!</div>
            <div class="controls-mini">
                <button id="pauseResumeBtn" class="celebrate-btn">⏸️ إيقاف الاحتفال</button>
                <button id="fanfareBtn" class="celebrate-btn">🎺 تشغيل تهليل</button>
                <button id="closeCelebrate" class="celebrate-btn" style="background:#bbb;color:#111">✖ إغلاق</button>
            </div>
        </div>
    </div>
</div>

<audio id="celebrationMusic" loop></audio>

<script>
    // ------------------------- التخزين المحلي (LocalStorage) -------------------------
    const STORAGE_KEY = 'top_students_list';

    // تحميل البيانات المحفوظة أو البدء بمصفوفة فارغة
    let students = [];

    function loadFromStorage() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) {
                    students = parsed;
                } else {
                    students = [];
                }
            } catch(e) {
                students = [];
            }
        } else {
            // يمكن إضافة طلاب نموذجيين كبداية (اختياري) — ولكن نتركها فارغة للحفاظ على النظافة
            students = [];
        }
    }

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
    }

    // ------------------------- دوال مساعدة -------------------------
    function getDefaultImageSVG(text = 'صورة') {
        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='100%' height='100%' fill='#1b2635'/><text x='50%' y='50%' fill='#9fb8ff' font-size='28' font-family='Arial' text-anchor='middle' alignment-baseline='middle'>${text}</text></svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    // إضافة طالب جديد مع حفظ تلقائي
    function addStudent(name, imgData) {
        const newStudent = {
            id: uid(),
            name: name,
            imgData: imgData
        };
        students.push(newStudent);
        saveToStorage();        // حفظ فوري
        renderGrid();
    }

    // حذف جميع الطلاب (يدوياً فقط عبر الزر)
    function clearAllStudents() {
        if (confirm('⚠️ تحذير: سيتم مسح جميع الطلاب نهائياً ولا يمكن استرجاعهم. هل أنت متأكد؟')) {
            students = [];
            saveToStorage();
            renderGrid();
            if (overlay.classList.contains('show')) {
                closeModalFunc();
            }
        }
    }

    // حذف طالب معين (اختياري - لم نضف زر حذف فردي، لكن يمكن إضافته لاحقاً)
    // لا حاجة الآن

    // ------------------------- عرض الشبكة -------------------------
    const grid = document.getElementById('grid');

    function renderGrid() {
        grid.innerHTML = '';
        if (students.length === 0) {
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--muted)">🏆 لا يوجد طلاب بعد — أضف طالبًا باستخدام النموذج أعلاه 🏆</div>`;
            return;
        }
        
        students.forEach(s => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const img = document.createElement('img');
            img.src = s.imgData;
            img.alt = s.name;
            img.onerror = function() {
                this.src = getDefaultImageSVG(s.name);
                // محاولة تحديث البيانات المخزنة بالصورة الافتراضية لتجنب الخطأ المستقبلي
                s.imgData = getDefaultImageSVG(s.name);
                saveToStorage();
            };
            
            const nameDiv = document.createElement('div');
            nameDiv.className = 'name';
            nameDiv.textContent = s.name;
            
            const subDiv = document.createElement('div');
            subDiv.className = 'sub';
            subDiv.textContent = 'طالب متميز';
            
            const btn = document.createElement('button');
            btn.className = 'celebrate-btn';
            btn.textContent = '🎉 احتفل!';
            
            const openHandler = () => openModal(s);
            img.addEventListener('click', openHandler);
            nameDiv.addEventListener('click', openHandler);
            btn.addEventListener('click', openHandler);
            
            card.appendChild(img);
            card.appendChild(nameDiv);
            card.appendChild(subDiv);
            card.appendChild(btn);
            grid.appendChild(card);
        });
    }

    // ------------------------- تأثيرات الاحتفال -------------------------
    let fireworks = [];
    let particles = [];
    let confetti = [];
    let fwSpawner = null;
    let confettiSpawner = null;
    let petalsSpawner = null;
    let animRunning = false;
    let paused = false;
    const fxCanvas = document.getElementById('fx');
    const ctx = fxCanvas.getContext('2d');
    let W = fxCanvas.width = window.innerWidth;
    let H = fxCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        W = fxCanvas.width = window.innerWidth;
        H = fxCanvas.height = window.innerHeight;
    });

    function rand(min, max) { return Math.random() * (max - min) + min; }

    function spawnRocket() {
        const rocket = {
            x: rand(W * 0.1, W * 0.9),
            y: H + 6,
            vx: rand(-1, 1),
            vy: rand(-11, -8),
            explodeAt: rand(H * 0.28, H * 0.55),
            color: `hsl(${Math.floor(rand(0, 360))},85%,60%)`
        };
        fireworks.push(rocket);
    }

    function spawnConfettiBurst() {
        for (let i = 0; i < 140; i++) {
            confetti.push({
                x: rand(0, W),
                y: rand(-H, 0),
                w: rand(6, 12),
                h: rand(8, 20),
                vx: rand(-1.2, 1.2),
                vy: rand(1, 3),
                rot: rand(0, Math.PI * 2),
                drot: rand(-0.12, 0.12),
                color: `hsl(${Math.floor(rand(0, 360))},80%,60%)`,
                life: rand(160, 520),
                age: 0
            });
        }
    }

    function spawnPetals() {
        const count = 12;
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'petal';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = -Math.random() * 60 - 20 + 'px';
            p.style.opacity = 0.95;
            p.style.transform = `rotate(${Math.random() * 360}deg)`;
            p.style.width = (10 + Math.random() * 22) + 'px';
            p.style.height = (10 + Math.random() * 22) + 'px';
            document.body.appendChild(p);
            animatePetalDOM(p);
        }
    }

    function animatePetalDOM(el) {
        const duration = 4500 + Math.random() * 3000;
        const startX = parseFloat(el.style.left);
        const endX = startX + (Math.random() * 40 - 20);
        const startTop = parseFloat(el.style.top);
        const endTop = H + 80;
        let start = null;
        function step(ts) {
            if (!start) start = ts;
            const t = (ts - start) / duration;
            if (t >= 1) { el.remove(); return; }
            const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
            el.style.left = (startX + (endX - startX) * ease) + '%';
            el.style.top = (startTop + (endTop - startTop) * ease) + 'px';
            el.style.opacity = 1 - t * 0.7;
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
        setTimeout(() => { if(el && el.parentElement) el.remove(); }, duration + 200);
    }

    function clearAllPetals() {
        document.querySelectorAll('.petal').forEach(e => e.remove());
    }

    function animLoop() {
        if (paused) {
            requestAnimationFrame(animLoop);
            return;
        }
        ctx.clearRect(0, 0, W, H);
        for (let i = fireworks.length-1; i>=0; i--) {
            const r = fireworks[i];
            r.vy += 0.32;
            r.x += r.vx * 2;
            r.y += r.vy * 1.15;
            ctx.beginPath();
            ctx.fillStyle = r.color;
            ctx.arc(r.x, r.y, 3, 0, Math.PI*2);
            ctx.fill();
            if (r.y < r.explodeAt || r.vy > 20) {
                const cnt = Math.floor(rand(24,50));
                for(let k=0;k<cnt;k++) {
                    particles.push({
                        x: r.x, y: r.y,
                        vx: Math.cos((k/cnt)*Math.PI*2)*rand(1.6,6),
                        vy: Math.sin((k/cnt)*Math.PI*2)*rand(1.6,6),
                        life: rand(40,160), age: 0,
                        color: `hsl(${Math.floor(rand(0,360))},85%,60%)`,
                        size: rand(1.6,3.8)
                    });
                }
                fireworks.splice(i,1);
            }
        }
        for (let i=particles.length-1; i>=0; i--) {
            const p = particles[i];
            p.age++;
            p.vy += 0.04;
            p.x += p.vx;
            p.y += p.vy;
            const alpha = Math.max(0, 1 - (p.age/p.life));
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
            if(p.age > p.life) particles.splice(i,1);
        }
        for (let i=confetti.length-1; i>=0; i--) {
            const c = confetti[i];
            c.age++;
            c.vy += 0.02;
            c.x += c.vx;
            c.y += c.vy;
            c.rot += c.drot;
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.rot);
            ctx.fillStyle = c.color;
            ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
            ctx.restore();
            if(c.age > c.life) confetti.splice(i,1);
        }
        requestAnimationFrame(animLoop);
    }

    let userAudio = null;
    const celebrationMusic = document.getElementById('celebrationMusic');

    function startCelebration() {
        if(animRunning && !paused) return;
        if(!animRunning) {
            animRunning = true;
            paused = false;
            fwSpawner = setInterval(() => spawnRocket(), 450);
            confettiSpawner = setInterval(() => spawnConfettiBurst(), 1600);
            petalsSpawner = setInterval(() => spawnPetals(), 2600);
            animLoop();
        } else if(paused) {
            paused = false;
        }
        if(userAudio) { userAudio.play().catch(e=>console.log); }
        else { celebrationMusic.play().catch(e=>console.log); }
    }

    function pauseCelebration() {
        paused = true;
        if(userAudio) userAudio.pause();
        else celebrationMusic.pause();
    }

    function resumeCelebration() {
        if(!animRunning) startCelebration();
        else { paused = false; }
        if(userAudio) userAudio.play().catch(e=>console.log);
        else celebrationMusic.play().catch(e=>console.log);
    }

    function stopCelebration() {
        paused = false;
        animRunning = false;
        clearInterval(fwSpawner); clearInterval(confettiSpawner); clearInterval(petalsSpawner);
        fwSpawner=confettiSpawner=petalsSpawner=null;
        fireworks = []; particles = []; confetti = [];
        clearAllPetals();
        ctx.clearRect(0,0,W,H);
        if(userAudio) { userAudio.pause(); userAudio.currentTime = 0; }
        else { celebrationMusic.pause(); celebrationMusic.currentTime = 0; }
    }

    function playFanfare() {
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AC();
            const now = audioCtx.currentTime;
            const notes = [880,1100,740,660,880];
            let t=0;
            notes.forEach(freq=>{
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine';
                o.frequency.value = freq;
                o.connect(g);
                g.connect(audioCtx.destination);
                g.gain.setValueAtTime(0.0001, now+t);
                g.gain.exponentialRampToValueAtTime(0.2, now+t+0.02);
                g.gain.exponentialRampToValueAtTime(0.0001, now+t+0.45);
                o.start(now+t);
                o.stop(now+t+0.5);
                t+=0.18;
            });
        } catch(e) { console.log("fanfare error",e); }
    }

    // ------------------------- تفاعلات المودال -------------------------
    const overlay = document.getElementById('overlay');
    const modalName = document.getElementById('modalName');
    const modalPhoto = document.getElementById('modalPhoto');
    const closeModalBtn = document.getElementById('closeModal');
    const closeCelebrate = document.getElementById('closeCelebrate');
    const pauseResumeBtn = document.getElementById('pauseResumeBtn');
    const fanfareBtnModal = document.getElementById('fanfareBtn');

    function openModal(s) {
        modalName.textContent = s.name;
        modalPhoto.src = s.imgData;
        modalPhoto.onerror = function() { this.src = getDefaultImageSVG(s.name); };
        overlay.classList.add('show');
        startCelebration();
        pauseResumeBtn.textContent = '⏸️ إيقاف الاحتفال';
    }

    function closeModalFunc() {
        overlay.classList.remove('show');
        stopCelebration();
    }

    closeModalBtn.addEventListener('click', closeModalFunc);
    closeCelebrate.addEventListener('click', closeModalFunc);

    pauseResumeBtn.addEventListener('click', () => {
        if(!animRunning) { startCelebration(); pauseResumeBtn.textContent = '⏸️ إيقاف الاحتفال'; return; }
        if(!paused) { pauseCelebration(); pauseResumeBtn.textContent = '▶️ استئناف الاحتفال'; }
        else { resumeCelebration(); pauseResumeBtn.textContent = '⏸️ إيقاف الاحتفال'; }
    });
    fanfareBtnModal.addEventListener('click', playFanfare);
    window.addEventListener('keydown', (e)=> { if(e.key==='Escape') closeModalFunc(); });
    overlay.addEventListener('click', (ev)=> { if(ev.target===overlay) closeModalFunc(); });

    // ------------------------- رفع الملفات والموسيقى -------------------------
    const studentNameInput = document.getElementById('studentName');
    const studentImageInput = document.getElementById('studentImage');
    const addBtn = document.getElementById('addBtn');
    const musicFileInput = document.getElementById('musicFile');
    const musicToggle = document.getElementById('musicToggle');
    const clearAllBtn = document.getElementById('clearAll');

    addBtn.addEventListener('click', () => {
        const name = studentNameInput.value.trim();
        if(!name) { alert('الرجاء إدخال اسم الطالب'); return; }
        const file = studentImageInput.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                addStudent(name, e.target.result);
                studentNameInput.value = '';
                studentImageInput.value = '';
            };
            reader.readAsDataURL(file);
        } else {
            addStudent(name, getDefaultImageSVG(name));
            studentNameInput.value = '';
        }
    });

    clearAllBtn.addEventListener('click', clearAllStudents);

    musicFileInput.addEventListener('change', () => {
        const f = musicFileInput.files[0];
        if(!f) return;
        if(userAudio) { userAudio.pause(); userAudio = null; }
        const url = URL.createObjectURL(f);
        userAudio = new Audio(url);
        userAudio.loop = true;
        if(animRunning && !paused) userAudio.play().catch(e=>console.log);
    });

    musicToggle.addEventListener('click', () => {
        if(userAudio) {
            if(userAudio.paused) { userAudio.play().catch(()=>{}); musicToggle.textContent = '🔊 تشغيل/إيقاف الموسيقى'; }
            else { userAudio.pause(); musicToggle.textContent = '🔇 تشغيل الموسيقى'; }
        } else {
            if(celebrationMusic.paused) { celebrationMusic.play().catch(()=>{}); musicToggle.textContent = '🔊 تشغيل/إيقاف الموسيقى'; }
            else { celebrationMusic.pause(); musicToggle.textContent = '🔇 تشغيل الموسيقى'; }
        }
    });

    // تحميل البيانات أولاً ثم العرض
    loadFromStorage();
    renderGrid();

    // إعداد الموسيقى الافتراضية
    celebrationMusic.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
    celebrationMusic.load();

    // تفعيل التفاعل الأول للمستخدم لتجاوز auto-policy
    document.body.addEventListener('click', function firstInteraction() {
        if(celebrationMusic.paused && !userAudio) celebrationMusic.play().catch(e=>console.log);
        else if(userAudio && userAudio.paused && animRunning && !paused) userAudio.play().catch(e=>console.log);
    }, { once: true });
</script>
</body>
